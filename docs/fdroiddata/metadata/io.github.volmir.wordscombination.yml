MaintainerNotes: |-
  data/word_sources.jsonl.gz contains UTF-8 JSONL provenance for all 20,103
  dictionary words (CC-BY-SA-4.0), not executable code. Its SHA-256 is
  bbb9392fb53d7652da2ecfb1965e0ac4140d1e73b713ed1ca62320dca6206d0d,
  enforced by the upstream verifyDictionaryLicenses build gate. The exact
  scanignore retains this attribution asset; scandelete only removes QA ZIPs.
  Android packages its decompressed content as assets/word_sources.jsonl
  (3,791,287 bytes). Both verifyDictionaryLicenses and syncDictionaryAssets
  require this file; it must not be removed before building.

  The published APK contains no DependencyInfoBlock. dependenciesInfo
  includeInApk/includeInBundle are disabled in app/build.gradle.kts. Auto-update
  follows the upstream release tags; developer-signed artifacts are published as
  WordsCombination-v<version>.apk. Release 1.1.1 (7) was built from two clean
  clones at different absolute paths; the exported developer-signed APK and
  its public download passed local apksigcopier verification. JDK 21 is
  selected persistently through org.gradle.java.home, not a transient export.

